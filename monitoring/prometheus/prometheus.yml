global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-ms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-ms:8082"]

  - job_name: management-ms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["management-ms:8080"]
