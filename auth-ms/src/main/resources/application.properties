spring.application.name=user
server.port=8082
server.servlet.context-path=/auth

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/auth_ms}
spring.mongodb.representation.uuid=standard
spring.mongodb.database=auth_ms
mongock.enabled=${MONGOCK_ENABLED:true}

jwt.secret=${JWT_SECRET:QWluZGEgcXVlIGV1IGFuZGFzc2UgcGVsbyB2YWxlIGRhIHNvbWJyYSBkYSBtb3J0ZSwgbsOjbyB0ZW1lcmlhIG1hbCBhbGd1bSwgcG9ycXVlIHR1IGVzdMOhcyBjb21pZ287IGEgdHVhIHZhcmEgZSBvIHRldSBjYWphZG8gbWUgY29uc29sYW0uU2FsbW9zIDIzOjQ=}
jwt.expiration-ms=86400000

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
# Em AWS usa IAM role (instance profile). Localmente, defina via env:
# SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY / SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
# e SPRING_CLOUD_AWS_SQS_ENDPOINT=http://localhost:4566

app.sqs.user-created-queue=${APP_SQS_USER_CREATED_QUEUE:user-created-queue}
app.sqs.user-deleted-queue=${APP_SQS_USER_DELETED_QUEUE:user-deleted-queue}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.cache.type=redis

# Observabilidade: somente endpoints necessarios para health check e Prometheus.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
